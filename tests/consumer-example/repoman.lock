# repoman.lock — the pinned toolchain for this repo.
#
# One manifest pins every manager (and RepoMan itself) so the whole toolchain
# moves in lockstep. `repoman-sync` reads this and installs the entries for the
# managers selected in `repoman.managers`, plus the [repoman] self entry.
#
# source forms:
#   path:/abs/path                      local checkout (dev)
#   git+https://host/org/repo@vX.Y.Z    pinned git ref (fleet)

[repoman]
package = "repoman"
source = "path:/home/andrew/Documents/Projects/repoman"

[managers.copy]
package = "copyroom"
source = "path:/home/andrew/Documents/Projects/copyroom"

[managers.git]
package = "gitman"
source = "path:/home/andrew/Documents/Projects/gitman"

# gitman's native dependency. Must be an explicit entry: `uv pip install` ignores
# gitman's [tool.uv.sources], so pyjutsu won't resolve otherwise. Built via maturin
# + the Rust toolchain the gitman manager module adds to the devenv. Not a manager —
# never add "git-pyjutsu" to repoman.managers; repoman-sync picks it up via the
# "<manager>-*" pseudo-entry rule, keyed off the selected "git".
[managers.git-pyjutsu]
package = "pyjutsu"
source = "path:/home/andrew/Documents/Projects/Pyjutsu"

[managers.test]
package = "testee"
source = "path:/home/andrew/Documents/Projects/testee"

[managers.session]
package = "zelligate"
source = "path:/home/andrew/Documents/Projects/zelligate"

# Pure-Python coding-agent manager. Note the intentional mismatch: the lock key is
# the manager *key* ("agent"), the package is the PyPI/dist name ("mypi-agent"), and
# the console script is "mypi" (the command the registry maps "agent" to).
[managers.agent]
package = "mypi-agent"
source = "path:/home/andrew/Documents/Projects/mypi-agent"

[managers.doc]
package = "docman"
source = "path:/home/andrew/Documents/Projects/docman"

# Spec manager. Like "agent", the names diverge deliberately: the lock key is the
# manager key ("spec"), while the package/dist and the console script are both "alliman"
# (the registry command). The third-party `allium` binary is NOT a manager entry — it's
# provisioned by allium-env's own devenv at the nix layer, never via this lock.
[managers.spec]
package = "alliman"
source = "path:/home/andrew/Documents/Projects/allium-env"
