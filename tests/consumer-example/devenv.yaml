# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# Throwaway consumer for the RepoMan spike. It imports the meta-module by local
# path and enables a single manager (test). This proves the "one import" wiring
# end to end before the full roster exists.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  repoman:
    url: path:../../modules
    flake: false
  # Approach-B manager inputs. devenv.yaml inputs are NOT transitive across a remote
  # module import, so a consumer that selects "doc" must declare docman's repo as an
  # input (repoman's doc manager module imports it presence-gated). nixpkgs-python is
  # required because docman's module pins languages.python.version.
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
  docman:
    url: path:../../../docman
    flake: false
  allium-env:
    url: path:../../../allium-env
    flake: false

imports:
  - repoman
