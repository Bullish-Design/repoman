# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# Throwaway consumer for the RepoMan spike. It imports the meta-module by local
# path and enables the full roster (copy git test). This proves the "one
# import" wiring end to end: all manager wrappers come from the host profile.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  repoman:
    url: path:../../modules
    flake: false
  # devenv.nix pins languages.python.version = "3.13", which needs this input.
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
  # shellij is installed by default (not a roster manager): RepoMan presence-imports
  # shellij's own devenv module (packages + guarded `shellij open` enterShell hook)
  # when this input is declared — no extra RepoMan option is needed.
  shellij:
    url: path:../../../shellij
    flake: false

imports:
  - repoman
