# repoman.lock — the MACHINE toolchain manifest (project 12).
#
# Pins the pure-CLI managers that live in the single system-wide toolchain venv
# ($REPOMAN_TOOLCHAIN_VENV, default ~/.local/share/repoman/venv). `repoman-sync --machine`
# reads this file and installs EVERY entry in ONE `uv pip install --upgrade` — the
# consumer's `repoman.managers` roster gates wiring/skills, not installation.
#
# This file is a FLOOR, not the whole truth. Each manager's own metadata carries its real
# requirements, and the sync resolves the lock and the managers together, so the stricter
# side always wins. The sync then verifies the result and refuses to record a manifest for
# a venv whose installed packages do not satisfy every installed manager (project 18).
#
# testee is deliberately ABSENT: it runs inside the consumer's code, so it is declared as a
# per-repo uv dev dependency in each consumer's pyproject.toml. See CONCEPT.md §3.
#
# source forms:
#   path:/abs/path                      local checkout (dev; installed --editable)
#   git+https://host/org/repo@vX.Y.Z    pinned git ref (fleet)
#   wheel:<requirement>                 prebuilt wheel from vendomat's wheelhouse (UV_FIND_LINKS)
#   url:<name> @ <https url>            one published artifact, by PEP 508 direct
#                                       reference — no wheelhouse, no UV_FIND_LINKS
#
# The committed file is the FLEET shape: every entry names a release, so it is correct
# on any machine, including a fresh clone with no working trees beside it. A developer
# who wants editable installs writes `repoman.local.lock` next to this file — an
# untracked OVERLAY with the same schema, in which only `source` is required. The sync
# layers the overlay over this lock, and `--no-local` skips the overlay so a CI runner
# gets the pure fleet shape. REPOMAN_LOCK and REPOMAN_LOCAL_LOCK override either path.
#
# An overlay key that this lock does not declare is a hard error. The overlay REPLACES a
# source; it never adds an entry.
#
# This inverts the earlier design, which committed the DEV shape and synthesized the
# fleet shape at push time through vendomat. That rewrite could not express a pin bump
# and cost a permanently divergent origin (devman 023-toolchain OVERLAY.md).

[repoman]
package = "repoman"
source = "git+https://github.com/Bullish-Design/repoman@v0.7.5"

[managers.copy]
package = "copyroom"
source = "git+https://github.com/Bullish-Design/copyroom@v0.7.4"

# v0.6.1, not the v0.6.0 the retired vendomat.toml named. gitman v0.6.0's
# [tool.uv.sources] pins pyjutsu by URL at v0.20.0, which conflicts with the v0.21.1 URL
# [managers.git-pyjutsu] names below — uv rejects two direct URLs for one package. Any
# bump to the pyjutsu entry must move this pin to a gitman release built against it.
[managers.git]
package = "gitman"
source = "git+https://github.com/Bullish-Design/gitman@v0.6.1"

# gitman's native dep — not a manager. Resolved by the "<manager>-*" pseudo-entry rule.
#
# The published, relocated manylinux asset — the same URL gitman's own
# [tool.uv.sources] names, and the one `direct_url.json` already records for the
# installed wheel. As of pyjutsu 0.21.1 this URL and vendomat's wheelhouse name
# the *same bytes*: vendomat performs the single hermetic build, stamps the
# manylinux tag, strips the store RUNPATH, and uploads that exact store file
# (devman 023-toolchain). The earlier note here — that the wheelhouse wheel
# carries a bare linux_x86_64 tag and a /nix/store RUNPATH — described the
# builder before it was repaired and no longer holds.
#
# This was `wheel:pyjutsu>=0.20.0` — a FLOOR resolved with --upgrade, so the next
# sync took whatever the wheelhouse held, and the wheelhouse exists in exactly one
# directory on one machine. A url: source names one artifact instead, which is what
# removes the UV_FIND_LINKS precondition from the machine bootstrap (023-toolchain
# P8).
[managers.git-pyjutsu]
package = "pyjutsu"
source = "url:pyjutsu @ https://github.com/Bullish-Design/Pyjutsu/releases/download/v0.21.1/pyjutsu-0.21.1-cp313-abi3-manylinux_2_39_x86_64.whl"

# v0.2.0, not the v0.1.0 the retired vendomat.toml named. The v0.1.0 tag predates
# docman becoming a Python package and carries no pyproject.toml, so uv refuses it.
[managers.doc]
package = "docman"
source = "git+https://github.com/Bullish-Design/docman@v0.2.0"

# templateer is NOT here, and its absence is the point (023-toolchain phase 5,
# step 3c). It was on this shelf from 2026-09-07 until the roster closure gained
# it in vendomat v0.3.6. Keeping both gave one command TWO owners — the shelf
# venv inside a devenv, the store closure outside one — with PATH order deciding
# which `templateer generate` a run got. That ambiguity is the defect this
# project exists to remove, so the shelf entry went and the closure kept it.
#
# MEASURED before removal: in a consumer devenv that names no provider,
# `command -v templateer` resolves to
# /nix/store/g497xl6ac4lwhiln0b0h6bqsmxkyxg4i-repoman-toolchain-core/bin/templateer,
# not to ~/.local/share/repoman/venv. Do not re-add it here without repeating
# that measurement and finding it false.

# vendomat is not a manager and has no roster entry. It is on the shelf as a CLI:
# it performs the hermetic native wheel build, stamps the manylinux tag, strips the
# store RUNPATH and uploads the release asset — the artifact [managers.git-pyjutsu]
# names by url:. Resolved by the "<manager>-*" pseudo-entry rule, routed under "git".
#
# It is NO LONGER here for a pre-push publish hook. This repo retired that path when
# it adopted the lock overlay (devman 023-toolchain OVERLAY.md); vendomat.toml and
# .pyjutsu-hooks.toml are gone.
[managers.git-vendomat]
package = "vendomat"
source = "git+https://github.com/Bullish-Design/vendomat@v0.3.7"
