# repoman.lock — the MACHINE toolchain manifest (project 12).
#
# Pins the pure-CLI managers that live in the single system-wide toolchain venv
# ($REPOMAN_TOOLCHAIN_VENV, default ~/.local/share/repoman/venv). `repoman-sync --machine`
# reads this file and installs EVERY entry in ONE `uv pip install --upgrade` — the
# consumer's `repoman.managers` roster gates wiring/skills, not installation.
#
# This file is a FLOOR, not the whole truth. Each manager's own metadata carries its real
# requirements, and the sync resolves the lock and the managers together, so the stricter
# side always wins. The sync then verifies the result and refuses to record a manifest for
# a venv whose installed packages do not satisfy every installed manager (project 18).
#
# testee is deliberately ABSENT: it runs inside the consumer's code, so it is declared as a
# per-repo uv dev dependency in each consumer's pyproject.toml. See CONCEPT.md §3.
#
# source forms:
#   path:/abs/path                      local checkout (dev; installed --editable)
#   git+https://host/org/repo@vX.Y.Z    pinned git ref (fleet)
#   wheel:<requirement>                 prebuilt wheel from vendomat's wheelhouse (UV_FIND_LINKS)
#
# The committed file is the DEV shape for this machine. The FLEET shape swaps each
# path: for git+https://github.com/Bullish-Design/<repo>@vX.Y.Z; a CI runner can
# point repoman-sync --machine at a fleet-shaped lock via REPOMAN_LOCK without
# editing this checkout (WS-3, project-12 follow-up).

[repoman]
package = "repoman"
source = "path:/home/andrew/Documents/Projects/repoman"

[managers.copy]
package = "copyroom"
source = "path:/home/andrew/Documents/Projects/copyroom"

[managers.git]
package = "gitman"
source = "path:/home/andrew/Documents/Projects/gitman"

# gitman's native dep — not a manager. Resolved by the "<manager>-*" pseudo-entry rule.
# The floor tracks what gitman declares; a pseudo-entry that lags behind its manager can
# no longer leave an unusable version installed, but a lagging floor still misreports the
# machine in `repoman doctor`'s version: rows.
[managers.git-pyjutsu]
package = "pyjutsu"
source = "wheel:pyjutsu>=0.20.0"

[managers.doc]
package = "docman"
source = "path:/home/andrew/Documents/Projects/docman"

# templateer: typed artifact generation. A CLI on the shared shelf, not a
# library any repo imports — devman's changelog workflow calls
# `templateer generate`. Pinned to a tag rather than a path: it is pure Python
# (hatchling, no native code), so a git tag is a sufficient pin and uv records
# a hash for it. This replaces the PYTHONPATH + `uv run --project <sibling>`
# spelling that reached templateer through a sibling checkout (023-toolchain
# P2/R2).
[managers.template]
package = "templateer"
source = "git+https://github.com/Bullish-Design/templateer_v2@v0.4.0"
