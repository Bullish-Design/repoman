[project]
name = "repoman"
# Keep in lockstep with `repoman.__version__` — tests/test_registry.py asserts they
# match, and flake.nix sources the package version from this field.
version = "0.12.1"
description = "The agentic repo lifecycle conductor for devenv.sh repos — one import that composes the *man manager family."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bullish-Design" }]
requires-python = ">=3.13"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[dependency-groups]
# Testee's wrapper is installed by the host profile. The checks run in devenv and
# use these project tools directly.
# pytest-cov: `[tool.pytest.ini_options] addopts` passes --cov, so pytest cannot start
# without it. Keep this check tool in the project environment so Testee can report it.
dev = ["pytest-cov>=5", "ty"]

[project.scripts]
repoman = "repoman.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repoman = [
    "templates/*.j2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers --cov=repoman --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
