inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
  nix2container:
    url: github:nlewo/nix2container
  mk-shell-bin:
    url: github:rrbutani/nix-mk-shell-bin

  # EVERY first-party input below is committed in its FLEET shape: a published tag,
  # reachable from any machine and from CI. To develop against a local checkout,
  # override the url in `devenv.local.yaml` — untracked, same schema, merged over
  # this file by devenv. Same rule as repoman.lock + repoman.local.lock: the
  # committed file says WHAT, the local overlay says WHERE.

  # Machine-bootstrap only: vendomat's module exports UV_FIND_LINKS at the prebuilt
  # pyjutsu wheelhouse, which `repoman-sync --machine` needs to resolve the wheel:
  # source in the machine repoman.lock. Consumers no longer declare this input.
  vendomat:
    url: "git+https://github.com/Bullish-Design/vendomat?ref=refs/tags/v0.3.4"

  # devman: the automation plane's repo interface (CONCEPT.md §3.2). A devenv
  # import is a PATH inside an input, never a flake output attribute, and the
  # file it resolves to must be named devenv.nix.
  devman:
    url: "git+https://github.com/Bullish-Design/devman?ref=refs/tags/v0.5.1"

  # Self-hosting (project 14 seam): repoman's OWN dev shell is a first-class managed
  # repo. Importing the meta-module from ./modules puts the whole manager suite on
  # PATH inside `cd repoman && devenv shell` — the canonical host for
  # `copyroom new <target>` bootstraps, with no dependency on another repo's shell.
  # The `repoman` input name matches what consumers declare
  # (github:Bullish-Design/repoman?dir=modules).
  #
  # `path:` and NOT a git url. A git input copies TRACKED files only, so a brand-new
  # module file would be invisible to nix until `git add` and would fail as an
  # eval error, never as "you forgot to stage". A path input reads the directory
  # literally. Nothing is lost: content-hashing an input that points at the very
  # tree nix is already evaluating buys no reproducibility.
  repoman:
    url: "path:./modules"
    flake: false

  # Approach-B provisioning for the "doc" manager: docman's own nix module (toolchain +
  # enterShell config seeding) is pulled through the presence-gated import in
  # modules/managers/docman.nix — only fire it here by declaring the input.
  docman:
    url: "git+https://github.com/Bullish-Design/docman?ref=refs/tags/v0.2.0"
    flake: false

  # shellij: durable Zellij workbenches, installed by default (not a roster
  # manager). This repo imports the meta-module below, so declaring the input is
  # enough — modules/devenv.nix presence-imports shellij's own devenv module,
  # exactly as it does for a template-py consumer.
  shellij:
    url: "git+https://github.com/Bullish-Design/shellij?ref=refs/tags/v0.3.0"
    flake: false

imports:
  - vendomat/modules
  - repoman
  - devman/modules
